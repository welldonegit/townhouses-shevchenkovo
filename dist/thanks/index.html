<!DOCTYPE html>

<head>
<meta charset="utf-8">

<link rel="icon" type="image/png" sizes="160x160" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,400;1,500;1,600&family=Onest:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>
<body>
<section style="position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:clamp(20px,5vw,64px);overflow:hidden;">
  <img src="/assets/townhouse-hero.jpg" alt="Таунхауси в с. Шевченкове" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;">
  <div style="position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(23,32,29,.34),rgba(23,32,29,.5));"></div>
  <div class="tk-anim" style="position:relative;z-index:2;width:100%;max-width:620px;background:#FFFFFF;border-radius:8px;padding:clamp(36px,5vw,72px) clamp(24px,5vw,64px);text-align:center;box-shadow:0 40px 90px -30px rgba(23,32,29,.45);animation:tkUp .7s cubic-bezier(.2,.7,.2,1) both;">
    <div class="tk-anim" style="width:clamp(64px,8vw,84px);height:clamp(64px,8vw,84px);margin:0 auto clamp(22px,2.6vw,32px);border-radius:50%;background:#EAF0EA;display:flex;align-items:center;justify-content:center;animation:tkPop .6s cubic-bezier(.2,.7,.2,1) .15s both;">
      <svg viewBox="0 0 48 48" fill="none" style="width:52%;height:52%;" aria-hidden="true">
        <path class="tk-anim" d="M13 24.5 20.5 32 35 16" stroke="#294239" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:44;stroke-dashoffset:44;animation:tkDraw .5s cubic-bezier(.6,0,.2,1) .55s forwards;"></path>
      </svg>
    </div>
    <h1 style="margin:0;font:800 clamp(28px,4.4vw,46px)/1.08 'Onest',sans-serif;letter-spacing:-.02em;color:#294239;text-wrap:balance;">Ваша заявка прийнята!</h1>
    <p style="margin:clamp(14px,1.6vw,20px) auto 0;max-width:34ch;font:400 clamp(16px,1.5vw,19px)/1.55 'Onest',sans-serif;color:#3C453F;text-wrap:pretty;">Менеджер зв'яжеться з вами найближчим часом.</p>
    <a class="tbtn" href="/" style="display:inline-flex;align-items:center;justify-content:center;margin-top:clamp(28px,3.4vw,42px);min-width:min(280px,100%);padding:16px 34px;border-radius:999px;background:#BC6848;color:#FFFFFF;font:600 15px/1 'Onest',sans-serif;letter-spacing:.01em;">
      <span class="roll"><span class="roll-in" data-text="На головну">На головну</span></span>
    </a>
  </div>
</section>
