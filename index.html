  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    *{box-sizing:border-box;}\n    html{scroll-behavior:smooth;}\n    html,body{margin:0;}\n    body{background:#F5F2EA;font-family:'Onest',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#17201D;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;}\n    a{color:#294239;text-decoration:none;}\n    a:hover{color:#BC6848;}\n    img{display:block;}\n    ::selection{background:#BC6848;color:#F6F1E7;}\n\n    .wrap{max-width:1440px;margin:0 auto;padding:0 clamp(20px,5vw,80px);}\n\n    .eb{font:600 12px/1 'Onest',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#8A8F86;}\n    .eb-loc{display:inline-flex;align-items:center;gap:8px;}\n\n    /* pills */\n    .pill{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:999px;padding:15px 27px;font:600 15px/1 'Onest',sans-serif;letter-spacing:.005em;cursor:pointer;border:1px solid transparent;transition:background .2s,color .2s,border-color .2s,transform .2s;white-space:nowrap;}\n    .pill:active{transform:translateY(1px);}\n    .pill-dark{background:#294239;color:#F5F2EA;}\n    .pill-dark:hover{background:#1E322A;color:#F5F2EA;}\n    .pill-accent{background:#BC6848;color:#F8F3EA;}\n    .pill-accent:hover{background:#A5573B;color:#F8F3EA;}\n    .pill-ghost{background:transparent;border-color:#C7C2B4;color:#17201D;}\n    .pill-ghost:hover{background:#17201D;border-color:#17201D;color:#F5F2EA;}\n    .pill-badge{padding:7px 8px 7px 26px;gap:16px;justify-content:space-between;}\n    .pill-ic{width:38px;height:38px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:none;}\n    .pill-accent .pill-ic{background:#F3EFE4;}\n    .pill-ghost .pill-ic{background:#BC6848;}\n\n    /* header */\n    .hdr{position:sticky;top:0;z-index:40;background:rgba(245,242,234,.86);backdrop-filter:saturate(1.1) blur(10px);-webkit-backdrop-filter:saturate(1.1) blur(10px);border-bottom:1px solid #E0DBCF;}\n    .hdr-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;height:88px;}\n    .wm{justify-self:start;line-height:.98;}\n    .wm .l1{display:block;font:700 15px/1 'Onest',sans-serif;letter-spacing:.12em;color:#17201D;}\n    .wm .l2{display:block;font:700 15px/1 'Onest',sans-serif;letter-spacing:.12em;color:#294239;margin-top:3px;}\n    .nav{display:flex;gap:clamp(14px,1.7vw,30px);justify-self:center;align-items:center;}\n    .nav a{display:inline-flex;align-items:center;gap:8px;font:500 15px/1 'Onest',sans-serif;color:#17201D;transition:color .2s;white-space:nowrap;}\n    .nav a svg{display:block;flex:none;transition:transform .25s;}\n    .nav a:hover{color:#BC6848;}\n    .nav a:hover svg [data-mk]{stroke:#BC6848;}\n    .hdr-r{justify-self:end;display:flex;align-items:center;gap:12px;}\n    .navbtn{display:none;justify-self:start;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:46px;height:46px;border:1px solid #D8D4CA;background:transparent;border-radius:999px;cursor:pointer;padding:0;transition:border-color .2s;}\n    .navbtn:hover{border-color:#294239;}\n    .navbtn i{display:block;width:18px;height:1.6px;background:#17201D;transition:transform .28s ease,opacity .2s;}\n    .navbtn.open i:nth-child(1){transform:translateY(6.6px) rotate(45deg);}\n    .navbtn.open i:nth-child(2){opacity:0;}\n    .navbtn.open i:nth-child(3){transform:translateY(-6.6px) rotate(-45deg);}\n    .phone-ic{display:none;align-items:center;justify-content:center;justify-self:end;width:46px;height:46px;border:1px solid #D8D4CA;background:transparent;border-radius:999px;transition:border-color .2s;}\n    .phone-ic:hover{border-color:#294239;}\n\n    .mm-scrim{display:none;}\n    .mm{display:none;}\n    .mm-inner{display:flex;flex-direction:column;min-height:100%;padding:22px 26px 28px;}\n    .mm-top{display:flex;align-items:center;justify-content:space-between;height:46px;margin-bottom:26px;}\n    .mm-wm{line-height:1;}\n    .mm-wm .l1{display:block;font:700 13px/1 'Onest',sans-serif;letter-spacing:.12em;color:#17201D;}\n    .mm-wm .l2{display:block;font:700 13px/1 'Onest',sans-serif;letter-spacing:.12em;color:#294239;margin-top:3px;}\n    .mm-close{position:relative;width:42px;height:42px;border:1px solid #D8D4CA;background:transparent;border-radius:999px;cursor:pointer;padding:0;transition:border-color .2s;}\n    .mm-close:hover{border-color:#294239;}\n    .mm-close i{position:absolute;top:50%;left:50%;width:16px;height:1.6px;background:#17201D;}\n    .mm-close i:nth-child(1){transform:translate(-50%,-50%) rotate(45deg);}\n    .mm-close i:nth-child(2){transform:translate(-50%,-50%) rotate(-45deg);}\n    .mm-nav{display:flex;flex-direction:column;}\n    .mm-nav a{font:500 21px/1 'Onest',sans-serif;color:#17201D;padding:17px 0;border-bottom:1px solid #E4E0D5;transition:color .2s;}\n    .mm-nav a:hover{color:#BC6848;}\n    .mm-foot{margin-top:auto;padding-top:26px;display:flex;flex-direction:column;gap:12px;}\n    .mm-phone{font:700 18px/1 'Onest',sans-serif;color:#17201D;margin-bottom:6px;}\n\n    /* hero */\n    .hero{padding-top:clamp(46px,6vw,92px);padding-bottom:clamp(40px,4.5vw,70px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:clamp(30px,4vw,64px);align-items:center;}\n    .hero-copy{min-width:0;}\n    .hero-h1{margin:20px 0 0;font-weight:700;letter-spacing:-.03em;font-size:clamp(38px,4.6vw,66px);line-height:1.0;color:#17201D;max-width:none;text-wrap:balance;}\n    .hero-h1 .acc{color:#BC6848;}\n    .hero-h1 .hl-lead{display:block;}\n    .hero-h1 .rot{display:block;overflow:hidden;white-space:nowrap;min-height:1.3em;}\n    .rotword{display:inline-block;will-change:transform,opacity;animation:rotword 2800ms cubic-bezier(.4,0,.2,1) both;}\n    @keyframes rotword{0%{opacity:0;transform:translateY(0.3em)}12%{opacity:1;transform:translateY(0)}86%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-0.3em)}}\n    .hero-sub{margin:clamp(8px,1vw,14px) 0 0;font:500 clamp(20px,2.35vw,34px)/1.24 'Onest',sans-serif;letter-spacing:-.01em;color:#AEB0A2;max-width:34ch;}\n    .hero-cta{margin:clamp(28px,3vw,42px) 0 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}\n    .hero-fine{margin:20px 0 0;font:400 14px/1.5 'Onest',sans-serif;color:#8A8F86;}\n    .hero-ticker{margin:clamp(24px,2.6vw,34px) 0 0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);}\n    .hero-ticker-track{display:inline-flex;align-items:center;white-space:nowrap;animation:ticker 24s linear infinite;will-change:transform;}\n    .hero-ticker-track span{font:500 clamp(14px,1.1vw,16px)/1 'Onest',sans-serif;letter-spacing:.005em;color:#294239;padding:0 22px;}\n    .hero-ticker-track i{width:5px;height:5px;border-radius:999px;background:#BC6848;flex:none;}\n    @keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}\n    @media (prefers-reduced-motion:reduce){.hero-ticker-track{animation:none;}}\n    .hero-media{border-radius:22px 0 0 22px;overflow:hidden;background:#E7E2D6;height:clamp(380px,46vw,600px);margin-right:calc(-1 * ((100vw - min(100vw,1440px))/2 + clamp(20px,5vw,80px)));}\n    .hero-media img{width:100%;height:100%;object-fit:cover;object-position:42% 58%;}\n\n    /* stat band */\n    .stats{border-top:1px solid #E0DBCF;margin-top:clamp(46px,5vw,84px);padding-top:clamp(34px,3.6vw,56px);display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(22px,2vw,36px);}\n    .stats>div{min-width:0;}\n    .stat-v{font:700 clamp(40px,4.6vw,68px)/.9 'Onest',sans-serif;letter-spacing:-.03em;color:#17201D;display:flex;align-items:flex-start;}\n    .stat-v.word{font-size:clamp(26px,3vw,42px);letter-spacing:-.02em;}\n    .stat-v .unit{font-size:.32em;font-weight:600;color:#9A9C90;margin-left:.08em;margin-top:.35em;letter-spacing:0;}\n    .stat-l{margin-top:16px;font:400 clamp(14px,1.05vw,16px)/1.4 'Onest',sans-serif;color:#7C817A;}\n\n    /* terms statement band */\n    .terms{padding-top:clamp(64px,8vw,128px);padding-bottom:clamp(64px,8vw,128px);}\n    .terms-eb{margin-bottom:clamp(22px,2.4vw,34px);}\n    .terms-h{margin:0;font-weight:700;letter-spacing:-.025em;font-size:clamp(30px,4.6vw,66px);line-height:1.02;max-width:22ch;}\n    .terms-h .mut{color:#AEB0A2;}\n    .terms-cta{margin-top:clamp(30px,3vw,44px);display:flex;gap:14px;flex-wrap:wrap;}\n\n    /* houses */\n    .houses{padding-bottom:clamp(72px,8vw,128px);}\n    .h-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;border-top:1px solid #E0DBCF;padding-top:clamp(30px,3.4vw,52px);margin-bottom:clamp(28px,3vw,44px);}\n    .h-title{margin:14px 0 0;font-weight:700;letter-spacing:-.025em;font-size:clamp(28px,3.9vw,58px);line-height:1.0;}\n    .h-title .mut{color:#AEB0A2;}\n    .h-desc{max-width:400px;font:400 clamp(14px,1.05vw,16px)/1.55 'Onest',sans-serif;color:#5C665F;padding-bottom:6px;}\n\n    .slider{position:relative;}\n    .track{display:flex;gap:clamp(14px,1.4vw,22px);overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none;cursor:grab;}\n    .track::-webkit-scrollbar{display:none;}\n    .track.drag{cursor:grabbing;scroll-behavior:auto;scroll-snap-type:none;}\n    .hcard{scroll-snap-align:start;flex:0 0 clamp(280px,78vw,404px);position:relative;border-radius:22px;overflow:hidden;aspect-ratio:4/5;cursor:pointer;background:#E7E2D6;}\n    .hcard img{width:100%;height:100%;object-fit:cover;object-position:50% 56%;transition:transform .6s cubic-bezier(.2,.6,.2,1);-webkit-user-drag:none;user-select:none;}\n    .hcard:hover img{transform:scale(1.05);}\n    .hcard::after{content:\"\";position:absolute;inset:0;background:linear-gradient(to top,rgba(20,26,22,.72) 0%,rgba(20,26,22,.28) 34%,rgba(20,26,22,0) 62%);}\n    .hcard-eb{position:absolute;top:22px;left:24px;z-index:2;font:600 12px/1 'Onest',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:rgba(248,244,236,.9);}\n    .hcard-b{position:absolute;left:24px;right:24px;bottom:22px;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;gap:14px;}\n    .hcard-t{color:#F8F4EC;}\n    .hcard-t .a{font:700 clamp(28px,2.4vw,38px)/1 'Onest',sans-serif;letter-spacing:-.02em;}\n    .hcard-t .a small{font-weight:500;font-size:.42em;letter-spacing:0;opacity:.82;margin-left:5px;}\n    .hcard-t .s{margin-top:8px;font:400 13.5px/1.4 'Onest',sans-serif;color:rgba(248,244,236,.82);max-width:24ch;}\n    .hcard-go{flex:none;width:44px;height:44px;border-radius:999px;background:rgba(245,242,234,.16);border:1px solid rgba(245,242,234,.5);display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s;}\n    .hcard:hover .hcard-go{background:#BC6848;border-color:#BC6848;}\n\n    .slider-foot{margin-top:clamp(24px,2.6vw,36px);display:flex;align-items:center;gap:clamp(16px,2vw,28px);}\n    .s-count{font:600 14px/1 'Onest',sans-serif;letter-spacing:.06em;color:#17201D;white-space:nowrap;font-variant-numeric:tabular-nums;}\n    .s-count b{color:#BC6848;}\n    .s-bar{position:relative;flex:1;height:2px;background:#E0DBCF;}\n    .s-thumb{position:absolute;top:0;height:100%;background:#294239;transition:left .18s ease,width .18s ease;}\n    .s-btns{display:flex;gap:10px;}\n    .s-btn{width:48px;height:48px;border:1px solid #294239;background:transparent;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,opacity .2s;}\n    .s-btn svg path{transition:stroke .2s;}\n    .s-btn:hover{background:#294239;}\n    .s-btn:hover svg path{stroke:#F5F2EA;}\n    .s-btn:disabled{opacity:.32;cursor:default;}\n    .s-btn:disabled:hover{background:transparent;}\n    .s-btn:disabled:hover svg path{stroke:#294239;}\n\n    /* footer :500 15px/1 'Onest',sans-serif;color:#17201D;transition:color .2s;}\n    .foot-nav a:hover{color:#BC6848;}\n    .foot-phone{font:600 15px/1 'Onest',sans-serif;color:#17201D;transition:color .2s;white-space:nowrap;}\n    .foot-phone:hover{color:#BC6848;}\n    @media (max-width:820px){\n      .foot-cta{grid-template-columns:1fr;}\n      .fcard{min-height:0;}\n      .fcard-beige{min-height:clamp(220px,44vw,300px);}\n    }\n    @media (max-width:560px){\n      .foot-bar{flex-direction:column;align-items:flex-start;gap:22px;}\n      .fcard .pill{width:100%;text-align:center;}\n    }\n\n    /* popup */\n    .mscrim{position:fixed;inset:0;background:rgba(20,26,22,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:clamp(10px,3vw,44px);animation:mfade .25s ease;}\n    @keyframes mfade{from{opacity:0}to{opacity:1}}\n    @keyframes mrise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}\n    .modal{position:relative;background:#F5F2EA;width:min(1080px,100%);max-height:92vh;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 44px 100px rgba(20,26,22,.32);animation:mrise .34s cubic-bezier(.2,.7,.2,1);}\n    .mclose{position:absolute;top:16px;right:16px;z-index:6;width:44px;height:44px;border:1px solid #D8D4CA;background:rgba(245,242,234,.9);border-radius:999px;cursor:pointer;transition:border-color .2s,background .2s;}\n    .mclose:hover{border-color:#294239;background:#F5F2EA;}\n    .mclose i{position:absolute;top:50%;left:50%;width:15px;height:1.6px;background:#17201D;}\n    .mclose i:nth-child(1){transform:translate(-50%,-50%) rotate(45deg);}\n    .mclose i:nth-child(2){transform:translate(-50%,-50%) rotate(-45deg);}\n    .mbody{display:grid;grid-template-columns:1.02fr .98fr;min-height:0;flex:1;overflow:hidden;}\n    .mleft{background:#ECE7DC;padding:clamp(18px,2.2vw,32px);display:flex;flex-direction:column;min-height:0;}\n    .planwrap{flex:1;display:flex;align-items:center;justify-cont roomunit\">м²<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"mblock\">\n          <div class=\"mh\">Особливості планування<\u002Fdiv>\n          <ul class=\"feats\"><sc-for list=\"{{ activeFeatures }}\" as=\"f\" hint-placeholder-count=\"5\"><li>{{ f }}<\u002Fli><\u002Fsc-for><\u002Ful>\n        <\u002Fdiv>\n        <a class=\"pill pill-accent mcta\" href=\"#\" sc-camel-on-click=\"{{ stop }}\">Отримати актуальну вартість<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"mnote\">Площі окремих приміщень наведені за кресленнями. Їх сума може відрізнятися від загальної площі будинку через конструкції та внутрішні стіни.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst HOUSES = [\n  { area: '63,20', sections: '№ 9 та № 11', spec: 'Дві кімнати · кухня-вітальня 21,91 м²',\n    variants: [{ rooms: ['21,91', '14,00', '11,95', '5,35', '3,38', '3,26'] }],\n    features: ['Велика кухня-вітальня', 'Дві окремі житлові кімнати', 'Санвузол, передпокій та допоміжні зони', 'Місця для газового котла, пральної та сушильної машин', 'Можливість встановлення каміна', 'Варіанти з дитячою, робочою зоною та системами зберігання'] },\n  { area: '59,04', sections: '№ 1 та № 5', spec: 'Кілька сценаріїв · кухня-вітальня до 21,68 м²',\n    variants: [\n      { rooms: ['21,68', '14,00', '11,08', '5,13', '2,01', '1,99'] },\n      { rooms: ['14,96', '13,02', '9,17', '5,13', '3,59'] }\n    ],\n    features: ['Кілька сценаріїв планування', 'Варіант із просторою кухнею-вітальнею та двома кімнатами', 'Варіант із більш розділеним зонуванням', 'Можливість облаштувати дитячу, робочу зону, гардеробну та камін', 'Місця для котла та побутової техніки'] },\n  { area: '57,60', sections: '№ 10', spec: 'Дві кімнати · кухня-вітальня 18,98 м²',\n    variants: [{ rooms: ['18,98', '13,61', '11,92', '5,32', '4,70'] }],\n    features: ['Кухня-вітальня', 'Дві окремі кімнати', 'Санвузол та вхідна технічна зона', 'Місця д t: -this.stepSize(), behavior: 'smooth' }); };\n    const next = () => { const t = this.trackRef.current; if (t) t.scrollBy({ left: this.stepSize(), behavior: 'smooth' }); };\n    const onPD = (e) => { const t = this.trackRef.current; if (!t) return; this._drag = { x: e.clientX, left: t.scrollLeft, moved: false }; t.classList.add('drag'); };\n    const onPM = (e) => { if (!this._drag) return; const t = this.trackRef.current; if (!t) return; const dx = e.clientX - this._drag.x; if (Math.abs(dx) > 4) this._drag.moved = true; t.scrollLeft = this._drag.left - dx; };\n    const onPU = () => { const t = this.trackRef.current; if (t) t.classList.remove('drag'); setTimeout(() => { this._drag = null; }, 0); };\n\n    const WORDS = ['власною ділянкою', 'свердловиною', 'газом'];\n    const rotWord = React.createElement('span', { key: this.state.wi, className: 'rotword' }, WORDS[this.state.wi % 3]);\n    const guardOpen = (hi) => (e) => { if (this._drag && this._drag.moved) { if (e) e.preventDefault(); return; } this.open(hi); };\n    const units = SECTION_MAP.map((hi, k) => {\n      const h = HOUSES[hi];\n      return { no: '№ ' + String(k + 1).padStart(2, '0'), area: h.area, spec: h.spec, open: guardOpen(hi) };\n    });\n\n    const i = this.state.activeHouse;\n    const active = i !== null ? HOUSES[i] : null;\n    const vCount = active ? active.variants.length : 0;\n    const variant = active ? Math.min(this.state.variant, vCount - 1) : 0;\n    const av = active ? active.variants[variant] : null;\n\n    return {\n      stop, toggleMenu, closeMenu, closeModal, stopProp, toggleZoom,\n      rotWord,\n      mmOpen: this.state.menuOpen ? 'open' : '',\n      burgerOpen: this.state.menuOpen ? 'open' : '',\n      trackRef: this.trackRef, onSlide, prev, next, onPD, onPM, onPU,\n      units,\n      counterNow: this.state.counterNow, thumbW: this.state.thumbW, thumbL: this.state.thumbL,\n      atStart: this.state.atStart, atEnd: this.state.atEnd,\n      setVar0: () => this.setState({ v
